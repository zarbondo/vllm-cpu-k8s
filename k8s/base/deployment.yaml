apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: inference-server
spec:
  replicas: 1
  # RWO volume and ~10 GiB of RAM per replica: never run the old and new pod side by side
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/component: inference-server
    spec:
      serviceAccountName: vllm
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        # Puts the weights into the PVC on the first start; on every later start it
        # sees the completion marker and exits in a second without network access.
        - name: model-downloader
          image: vllm-model-downloader
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-env
          env:
            # only the init container gets the Hugging Face token
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HF_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp

      containers:
        - name: vllm
          image: vllm-cpu
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-env
          env:
            # Bearer token for clients; vLLM reads it from the environment
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: VLLM_API_KEY
            # OpenMP thread count is derived from it (see docker/vllm/entrypoint.sh)
            - name: CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: vllm
                  resource: limits.cpu
                  divisor: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # /health is not behind the API key. Loading + torch.compile on CPU takes
          # minutes, the startup probe allows up to 15 of them.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # requests == limits: Guaranteed QoS, the pod is the last to be evicted.
          # Memory: weights (~3.1 GiB bf16) + KV cache (kv-cache-memory-bytes)
          # + API server, engine core and worker processes.
          resources:
            requests:
              cpu: "4"
              memory: 10Gi
            limits:
              cpu: "4"
              memory: 10Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: serve-config
              mountPath: /etc/vllm/serve
              readOnly: true
            - name: home        # caches: torch.compile, triton, numba
              mountPath: /home/vllm
            - name: tmp
              mountPath: /tmp
            - name: dshm        # shared memory between vLLM processes (default 64 MiB is too small)
              mountPath: /dev/shm

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: serve-config
          configMap:
            name: vllm-serve-config
        - name: home
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
